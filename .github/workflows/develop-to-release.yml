name: Criar PR Develop → Release (Manual)

on:
  workflow_dispatch: # Só roda manualmente, evita disparo automático

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar branches existentes
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const base = 'release';
            const head = 'develop';

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base: base
            });

            if (existing.length > 0) {
              console.log("PR da develop para release já existe.");
              return;
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge Develop → Release`,
              head: head,
              base: base,
              body: `## PR de preparação de release\n\nEsse PR une o que foi desenvolvido na \`develop\` para a \`release\`, e precisa ser aprovado por @wellmsan antes do merge.`,
              draft: false
            });

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: ['wellmsan']
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['review-release']
            });
