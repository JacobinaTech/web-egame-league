name: Release a partir da Develop

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  wait-for-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar aprovação de `wellmsan` antes de prosseguir
        uses: peter-evans/manual-approve-action@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          approvers: wellmsan

  release:
    needs: wait-for-approval
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Instalar semantic-release e plugins
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Rodar semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release --branches release
