name: Aprovar e gerar versão

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  liberar-status:
    if: github.event.review.state == 'approved' && github.event.review.user.login == 'wellmsan'
    runs-on: ubuntu-latest

    steps:
      - name: Marcar como aprovado
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'Aguardando aprovação de wellmsan',
              description: 'Aprovado por wellmsan',
              target_url: context.payload.review.html_url
            });

  gerar-release:
    if: github.event.review.state == 'approved' && github.event.review.user.login == 'wellmsan'
    needs: liberar-status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Instalar semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Executar semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release --branches release
