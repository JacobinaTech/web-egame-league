name: PR Develop → Release

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  pull-requests: write

jobs:
  create-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Develop → Release (${new Date().toISOString().split('T')[0]})`,
              head: 'develop',
              base: 'release',
              body: 'PR automático para iniciar ciclo de release.',
            });
