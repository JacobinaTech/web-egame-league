name: PR Develop → Release + semantic-release → Main

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-and-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Verificar branch e commits
        run: |
          echo "Branch HEAD: $(git branch --show-current)"
          git log --oneline -n 10

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: semantic-release:*
        run: |
          semantic-release --branches release --dry-run
          # Retire o --dry-run quando estiver pronto para versionamento real

      - name: Criar PR da release para main
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = 'release';
            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const exists = branches.some(b => b.name === branchName);

            if (!exists) {
              core.setFailed(`Branch '${branchName}' não encontrada para criar o PR.`);
            } else {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Release → Main (${new Date().toISOString().split('T')[0]})`,
                head: branchName,
                base: 'main',
                body: 'PR automático para produção após merge da develop.',
              });
            }
