name: Criar PR Develop → Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Criar PR manual
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:develop`,
              base: 'release'
            });

            if (pulls.length > 0) {
              console.log('Já existe PR aberto de develop para release.');
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release: develop → release`,
              head: 'develop',
              base: 'release',
              body: 'PR manual para release com aprovação obrigatória de wellmsan',
              draft: false
            });

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: ['wellmsan'],
            });

            console.log(`PR criado: ${pr.html_url}`);
