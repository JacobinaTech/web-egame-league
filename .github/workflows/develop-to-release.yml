name: Criar PR manual: develop → release

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Criar PR com reviewer
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            const branchExists = async (branchName) => {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: branchName });
                return true;
              } catch {
                return false;
              }
            };

            if (!(await branchExists('develop')) || !(await branchExists('release'))) {
              throw new Error('As branches develop e release devem existir.');
            }

            const existingPRs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:develop`,
              base: 'release'
            });

            if (existingPRs.data.length > 0) {
              console.log('PR já existe.');
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Release: develop → release',
              head: 'develop',
              base: 'release',
              body: 'PR criado automaticamente para promover develop para release.',
              draft: false
            });

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: pr.number,
              reviewers: ['wellmsan']
            });

            console.log(`PR criado com sucesso: ${pr.html_url}`);
