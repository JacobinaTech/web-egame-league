name: PR Develop → Release

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extrair nome da branch
        id: extract_branch
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Develop → Release (${new Date().toISOString().split('T')[0]})`,
              head: branch,
              base: 'release',
              body: 'PR automático para iniciar ciclo de release.',
            });
