on:
  workflow_dispatch:

jobs:
  criar-pr:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Criar PR develop → release
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: release
          branch: develop
          title: "Merge develop into release"
          body: "Este PR precisa ser aprovado por wellmsan antes do merge."
          draft: false

  aguardar-aprovacao:
    needs: criar-pr
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar aprovação manual
        uses: trstringer/manual-approval@v1
        with:
          approvers: wellmsan
          issue-title: "Aprovação necessária para merge do PR #${{ needs.criar-pr.outputs.pr-number }}"
          issue-body: |
            Por favor, revise e aprove o PR de `develop` para `release`.

            Link do PR: https://github.com/${{ github.repository }}/pull/${{ needs.criar-pr.outputs.pr-number }}

          secret: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          timeout-minutes: 120

  mergear-release:
    needs: aguardar-aprovacao
    runs-on: ubuntu-latest
    steps:
      - name: Mergear PR após aprovação
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const prNumber = ${{ needs.criar-pr.outputs.pr-number }};
            await github.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: "squash"
            });
