name: Release - Approve & Versionar

on:
  pull_request:
    types: [closed]
    branches:
      - release

permissions:
  contents: write
  pull-requests: read

jobs:
  verificar-aprovador:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      aprovado: ${{ steps.checar-aprovador.outputs.aprovado }}
    steps:
      - name: Checar aprovação do PR por 'wellmsan'
        id: checar-aprovador
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const aprovadoPorWell = reviews.data.some(
              review => review.user.login === 'wellmsan' && review.state === 'APPROVED'
            );

            if (!aprovadoPorWell) {
              core.setFailed("❌ O PR não foi aprovado por 'wellmsan'.");
            } else {
              core.setOutput("aprovado", "true");
              console.log("✅ Aprovado por 'wellmsan'.");
            }

  gerar-release:
    needs: verificar-aprovador
    if: needs.verificar-aprovador.outputs.aprovado == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Instalar semantic-release e plugins
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Executar semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release --branches release
