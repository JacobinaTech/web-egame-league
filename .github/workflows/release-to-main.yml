name: PR Release → Main

on:
  pull_request:
    types: [closed]
    branches:
      - release/**

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extrair nome da release
        id: extract
        run: echo "RELEASE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Criar PR automático para main
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.RELEASE_BRANCH;

            // Verifica se já existe PR da release para main
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              base: 'main'
            });

            if (existing.data.length > 0) {
              console.log("Já existe PR da release para main. Ignorando.");
              return;
            }

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release → Main (${new Date().toISOString().split('T')[0]})`,
              head: branch,
              base: 'main',
              body: 'PR automático para produção',
            });
